<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLESS Key Grabber</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --text: #e6edf3;
    --muted: #8b949e;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 16px;
  }
  header { text-align: center; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.82rem; margin-top: 6px; }

  .top-bar {
    width: 100%; max-width: 760px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .total-badge {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
  }
  .total-badge strong { color: var(--green); }

  .buttons { display: flex; gap: 10px; }
  button {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-refresh { background: var(--accent); color: #0d1117; }
  #btn-download { background: var(--green); color: #0d1117; }
  button svg { width: 15px; height: 15px; flex-shrink: 0; }
  .spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid #0d1117; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sources { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }

  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .source-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .source-name {
    font-size: 0.82rem; font-weight: 600; font-family: var(--font-mono);
    color: var(--accent);
  }
  .source-status { font-size: 0.78rem; font-family: var(--font-mono); color: var(--muted); }
  .source-status.ok { color: var(--green); }
  .source-status.err { color: #f85149; }
  .source-status.loading { color: var(--yellow); }

  textarea {
    display: block; width: 100%;
    background: var(--bg); color: var(--text);
    border: none; padding: 12px 16px;
    font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6;
    resize: vertical; outline: none; min-height: 160px;
  }

  footer { color: var(--muted); font-size: 0.75rem; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>VLESS <span>Key Grabber</span></h1>
  <p>Собирает ключи из нескольких источников в один файл</p>
</header>

<div class="top-bar">
  <span class="total-badge" id="total-badge">Нажмите «Обновить»</span>
  <div class="buttons">
    <button id="btn-refresh" onclick="fetchAll()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.36-3.36L23 10M1 14l5.13 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Обновить
    </button>
    <button id="btn-download" onclick="downloadKeys()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Скачать всё
    </button>
  </div>
</div>

<div class="sources" id="sources-container"></div>

<footer>Только для личного использования</footer>

<script>
const SOURCES = [
  {
    name: "BLACK_VLESS_RUS.txt",
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt",
    desc: "igareck · основной список"
  },
  {
    name: "BLACK_VLESS_RUS_mobile.txt",
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt",
    desc: "igareck · мобильный список"
  },
  {
    name: "WHITE-CIDR-RU-checked.txt",
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt",
    desc: "igareck · whitelist RU"
  },
  {
    name: "keys.json (tiagorrg)",
    url: "https://tiagorrg.github.io/vless-checker/keys.json",
    desc: "tiagorrg · vless-checker",
    isJson: true
  }
];

let allKeys = [];

function buildUI() {
  const container = document.getElementById("sources-container");
  container.innerHTML = "";
  SOURCES.forEach((src, i) => {
    container.innerHTML += `
      <div class="source-card">
        <div class="source-header">
          <span class="source-name">${src.name}</span>
          <span class="source-status" id="status-${i}">${src.desc}</span>
        </div>
        <textarea id="textarea-${i}" readonly placeholder="Ожидание..."></textarea>
      </div>`;
  });
}

async function fetchTxt(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  return text.split("\n").map(l => l.trim()).filter(l => l.startsWith("vless://"));
}

async function fetchJson(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  const keys = [];
  for (const section of Object.values(data)) {
    if (typeof section !== "object" || Array.isArray(section)) continue;
    for (const entries of Object.values(section)) {
      if (!Array.isArray(entries)) continue;
      for (const entry of entries) {
        let key = null;
        if (typeof entry === "string") key = entry.trim();
        else if (typeof entry === "object" && entry !== null) {
          for (const f of ["key","vless","uri","config","link"]) {
            if (entry[f]) { key = String(entry[f]).trim(); break; }
          }
        }
        if (key && key.startsWith("vless://")) keys.push(key);
      }
    }
  }
  return keys;
}

async function fetchAll() {
  buildUI();
  const btn = document.getElementById("btn-refresh");
  const dlBtn = document.getElementById("btn-download");
  const badge = document.getElementById("total-badge");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Загрузка...`;
  dlBtn.disabled = true;
  badge.innerHTML = "Загружаю...";

  const seen = new Set();
  allKeys = [];
  let totalCount = 0;

  const promises = SOURCES.map(async (src, i) => {
    const statusEl = document.getElementById(`status-${i}`);
    const ta = document.getElementById(`textarea-${i}`);
    statusEl.className = "source-status loading";
    statusEl.textContent = "загрузка...";
    try {
      const keys = src.isJson ? await fetchJson(src.url) : await fetchTxt(src.url);
      const unique = keys.filter(k => { if (seen.has(k)) return false; seen.add(k); allKeys.push(k); return true; });
      ta.value = unique.join("\n");
      statusEl.className = "source-status ok";
      statusEl.textContent = `✓ ${unique.length} ключей`;
      totalCount += unique.length;
    } catch(e) {
      ta.value = "";
      statusEl.className = "source-status err";
      statusEl.textContent = `✗ ${e.message}`;
    }
  });

  await Promise.all(promises);

  const now = new Date().toLocaleString("ru-RU");
  badge.innerHTML = `Итого уникальных: <strong>${allKeys.length}</strong> · ${now}`;
  dlBtn.disabled = allKeys.length === 0;

  btn.disabled = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.36-3.36L23 10M1 14l5.13 4.36A9 9 0 0 0 20.49 15"/></svg> Обновить`;
}

function downloadKeys() {
  if (!allKeys.length) return;
  const now = new Date().toLocaleString("ru-RU");
  const text = `# VLESS keys — ${now}\n# Всего ключей: ${allKeys.length}\n\n${allKeys.join("\n")}\n`;
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vless_keys.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

buildUI();
</script>
</body>
</html>
